<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://appassets.androidplatform.net; img-src 'self' data: https://mt0.google.com https://mt1.google.com https://mt2.google.com https://mt3.google.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://server.arcgisonline.com https://*.arcgisonline.com https://*.openstreetmap.org https://appassets.androidplatform.net https:; style-src 'self' 'unsafe-inline' https://appassets.androidplatform.net; script-src 'self' 'unsafe-inline' https://appassets.androidplatform.net;" />
    <title>Zevira Map</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0A0B0F;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Dark mode filter for street tiles */
        .dark-tiles .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(96%);
        }
        /* Custom glowing blue user marker */
        .user-marker-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-pulse {
            width: 36px;
            height: 36px;
            background-color: rgba(45, 123, 255, 0.28);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 14px rgba(45, 123, 255, 0.5);
        }
        .user-dot {
            width: 16px;
            height: 16px;
            background-color: #2D7BFF;
            border: 3.5px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
        }
        .start-marker {
            width: 22px;
            height: 22px;
            background-color: #3DDC97;
            border: 3px solid #0F1B3D;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #0F1B3D;
        }
    </style>
</head>
<body>
    <div id="map" class="dark-tiles"></div>
    <script src="leaflet.js"></script>
    <script>
        var map = null;
        var streetTileLayer = null;
        var satelliteHybridLayer = null;
        var currentMapStyle = "streets";
        var userMarker = null;
        var accuracyCircle = null;
        var startMarker = null;
        var routePolyline = null;
        var highlightPolyline = null;
        var autoFollow = true;
        var currentLat = 0;
        var currentLng = 0;

        function initZeviraMap(startLat, startLng, style) {
            currentMapStyle = style || "streets";
            currentLat = startLat || -6.2088;
            currentLng = startLng || 106.8456;

            map = L.map('map', {
                center: [currentLat, currentLng],
                zoom: 17,
                zoomControl: false,
                attributionControl: false,
                preferCanvas: true
            });

            // 1. Street Map (Google Maps standard roadmap)
            streetTileLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=id&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['0', '1', '2', '3']
            });

            // 2. Satellite Hybrid
            satelliteHybridLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&hl=id&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['0', '1', '2', '3']
            });

            applyMapStyle(currentMapStyle);

            // Polylines with neon orange glowing route
            routePolyline = L.polyline([], {
                color: '#F37812',
                weight: 5,
                opacity: 0.95,
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);

            highlightPolyline = L.polyline([], {
                color: '#FFA834',
                weight: 6,
                opacity: 0.9,
                dashArray: '10, 10'
            }).addTo(map);

            // User pan listener stops auto-follow
            map.on('dragstart', function() {
                autoFollow = false;
                if (window.ZeviraBridge && window.ZeviraBridge.onUserPan) {
                    window.ZeviraBridge.onUserPan();
                }
            });

            if (window.ZeviraBridge && window.ZeviraBridge.onMapReady) {
                window.ZeviraBridge.onMapReady();
            }
        }

        function setMapStyle(style) {
            applyMapStyle(style);
        }

        function applyMapStyle(style) {
            currentMapStyle = style;
            if (!map) return;
            var isSatellite = (style === "satellite_hybrid" || style === "satelit" || style === "real_life");
            var mapEl = document.getElementById('map');

            if (isSatellite) {
                if (mapEl) mapEl.classList.remove('dark-tiles');
                if (streetTileLayer && map.hasLayer(streetTileLayer)) {
                    map.removeLayer(streetTileLayer);
                }
                if (satelliteHybridLayer && !map.hasLayer(satelliteHybridLayer)) {
                    satelliteHybridLayer.addTo(map);
                }
            } else {
                if (mapEl) mapEl.classList.add('dark-tiles');
                if (satelliteHybridLayer && map.hasLayer(satelliteHybridLayer)) {
                    map.removeLayer(satelliteHybridLayer);
                }
                if (streetTileLayer && !map.hasLayer(streetTileLayer)) {
                    streetTileLayer.addTo(map);
                }
            }
        }

        function setStartLocation(lat, lng) {
            if (!map) return;
            if (!startMarker) {
                var startIcon = L.divIcon({
                    className: 'start-marker-wrap',
                    html: '<div class="start-marker">S</div>',
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });
                startMarker = L.marker([lat, lng], { icon: startIcon }).addTo(map);
            } else {
                startMarker.setLatLng([lat, lng]);
            }
        }

        function updateLocation(lat, lng, accuracy, heading, isTracking) {
            if (!map) return;
            var isFirstFix = !userMarker;
            currentLat = lat;
            currentLng = lng;

            // Accuracy circle with blue tint
            if (!accuracyCircle) {
                accuracyCircle = L.circle([lat, lng], {
                    radius: accuracy || 10,
                    color: '#2D7BFF',
                    fillColor: '#2D7BFF',
                    fillOpacity: 0.12,
                    weight: 1.2
                }).addTo(map);
            } else {
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy || 10);
            }

            // User marker
            if (!userMarker) {
                var userIcon = L.divIcon({
                    className: 'user-marker-wrap',
                    html: '<div class="user-pulse"><div class="user-dot"></div></div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
            }

            // Realtime tracking polyline
            if (isTracking && routePolyline) {
                routePolyline.addLatLng([lat, lng]);
            }

            if (autoFollow) {
                if (isFirstFix) {
                    map.setView([lat, lng], 17);
                } else {
                    map.panTo([lat, lng], { animate: true, duration: 0.5 });
                }
            }
        }

        function clearTrackingRoute() {
            if (routePolyline) {
                routePolyline.setLatLngs([]);
            }
        }

        function appendPoints(pointsJson) {
            if (!map || !routePolyline) return;
            var points = JSON.parse(pointsJson);
            for (var i = 0; i < points.length; i++) {
                routePolyline.addLatLng([points[i].lat, points[i].lng]);
            }
        }

        function recenterMap() {
            autoFollow = true;
            if (map && currentLat !== 0 && currentLng !== 0) {
                map.setView([currentLat, currentLng], 17, { animate: true });
            }
        }

        function highlightRoute(pointsJson) {
            if (!map || !highlightPolyline) return;
            var points = JSON.parse(pointsJson);
            var latLngs = [];
            for (var i = 0; i < points.length; i++) {
                latLngs.push([points[i].lat, points[i].lng]);
            }
            highlightPolyline.setLatLngs(latLngs);
        }
    </script>
</body>
</html>
